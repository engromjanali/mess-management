<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simple, transparent mess management for every member.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mess Pilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mess Pilot</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: SFProRounded;
      src: url('assets/assets/fonts/sf_pro_rounded/SF-Pro-Rounded-Bold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --launch-background: #F5F5F5;
      --launch-surface: #FFFFFF;
      --launch-text: #212121;
      --launch-primary: #1FA463;
      --launch-primary-rgb: 31, 164, 99;
      --launch-accent: #FFB300;
    }

    :root[data-launch-theme="dark"] {
      --launch-background: #121212;
      --launch-surface: #1E1E1E;
      --launch-text: #FFFFFF;
      --launch-primary: #35C57F;
      --launch-primary-rgb: 53, 197, 127;
      --launch-accent: #FFC233;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--launch-background);
    }

    #flutter-launch-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: var(--launch-background);
      font-family: SFProRounded, sans-serif;
    }

    .launch-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      max-height: 100%;
    }

    .launch-loader {
      position: relative;
      width: 132px;
      height: 132px;
      flex-shrink: 0;
    }

    .launch-loader::before {
      position: absolute;
      inset: 10.576923%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--launch-primary-rgb), 0.18), rgba(var(--launch-primary-rgb), 0) 70.71%);
      content: '';
    }

    .launch-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: launch-rotate 1.8s linear infinite;
    }

    .launch-logo-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 5.076923px;
      border: 1.269231px solid rgba(var(--launch-primary-rgb), 0.15);
      border-radius: 50%;
      background: var(--launch-surface);
      box-shadow: 0 3.807692px 15.230769px rgba(var(--launch-primary-rgb), 0.12);
    }

    .launch-logo {
      display: block;
      width: 68.538462px;
      height: 68.538462px;
      border-radius: 50%;
      object-fit: cover;
    }

    .launch-title {
      margin-top: 24px;
      color: var(--launch-text);
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
    }

    @keyframes launch-rotate {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .launch-ring { animation: none; }
    }
  </style>
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('flutter.theme_mode')) || 'light';
      const dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.launchTheme = dark ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.launchTheme = 'light';
    }
  </script>
  <script>
    window.messMapsAuthFailed = false;
    window.gm_authFailure = function () {
      window.messMapsAuthFailed = true;
    };
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBktvyfMj1GRqOnf3gFFdB6idMLhwrX9VQ"></script>
</head>
<body>
  <div id="flutter-launch-screen" role="status" aria-label="Loading Mess Pilot">
    <div class="launch-content">
      <div class="launch-loader" aria-hidden="true">
        <svg class="launch-ring" viewBox="0 0 104 104" fill="none">
          <defs>
            <linearGradient id="launch-ring-gradient" x1="52" y1="9" x2="71.52" y2="90.31" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--launch-primary)" stop-opacity="0.12"/>
              <stop offset="1" stop-color="var(--launch-primary)"/>
            </linearGradient>
          </defs>
          <circle cx="52" cy="52" r="43" stroke="var(--launch-primary)" stroke-opacity="0.1" stroke-width="2.5"/>
          <path d="M52 9 A43 43 0 0 1 71.52 90.31" stroke="url(#launch-ring-gradient)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="52" cy="52" r="43" stroke="var(--launch-accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="31.07 239.11" transform="rotate(117 52 52)"/>
          <circle cx="52" cy="9" r="3.5" fill="var(--launch-primary)"/>
        </svg>
        <div class="launch-logo-frame"><img class="launch-logo" src="logo.png" alt=""></div>
      </div>
      <div class="launch-title">Mess Pilot</div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('flutter-launch-screen')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
