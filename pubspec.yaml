# name: mess_pilot
# description: A digital solution for your mess.
name: clean_boilerplate
description: A Clean Architecture Flutter boilerplate with BLoC and code generation
publish_to: 'none'
version: 1.0.0+0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  hydrated_bloc: ^11.0.0
  
  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0
  
  # Navigation
  go_router: ^18.1.1
  
  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  
  # Localization
  intl: ^0.20.3
  
  # Network
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  
  # Local Storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  
  # Utilities
  equatable: ^3.0.0
  logger: ^2.8.0
  flutter_svg: ^2.3.0
  collection: ^1.19.1
  email_validator: ^3.0.0
  phone_numbers_parser: ^9.0.28
  google_maps_flutter: ^2.19.0


  country_code_picker: ^3.4.1
  firebase_core: ^5.0.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  cupertino_icons: ^2.0.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.16.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3
  flutter_gen_runner: ^5.13.0+1
  
  # Testing
#  bloc_test: ^9.1.5

  # Linting
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  google_maps_flutter_platform_interface: ^2.17.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/
    - assets/images/
    - assets/images/svg/
    - assets/images/svg/flags/
    - shorebird.yaml


  fonts:
    - family: SFProRounded
      fonts:
        - asset: assets/fonts/sf_pro_rounded/SF-Pro-Rounded-Bold.otf
          weight: 700
        - asset: assets/fonts/sf_pro_rounded/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: assets/fonts/sf_pro_rounded/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: assets/fonts/sf_pro_rounded/SF-Pro-Rounded-Regular.otf
          weight: 400


flutter_gen:
  output: lib/core/assets/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    outputs:
      class_name: Assets

  fonts:
    outputs:
      class_name: FontFamily
